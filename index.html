<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Spinforge</title>
    <style>
      /* One set of tokens shared by the HUD, the forge (workshop.css) and the touch controls (touch.css). */
      :root {
        --me: #ff7a33;
        --tm: #3b8cff;
        --foe: #49b6ff;
        --tf: #ff4a3a;
        --ink: #eef2fa;
        --dim: #8b95aa;
        --mute: #5f6a80;
        --bg: #05070b;
        --glass: rgba(14, 18, 28, 0.62);
        --glass-strong: rgba(10, 13, 21, 0.82);
        --hair: rgba(255, 255, 255, 0.09);
        --hair-strong: rgba(255, 255, 255, 0.18);
        --hi: inset 0 1px 0 rgba(255, 255, 255, 0.07);
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
        --blur: blur(14px) saturate(1.3);
        --r-sm: 10px;
        --r-md: 14px;
        --r-lg: 18px;
        --s1: 4px;
        --s2: 8px;
        --s3: 12px;
        --s4: 16px;
        --s5: 24px;
        --fs-xs: 10px;
        --fs-sm: 12px;
        --fs-md: 14px;
        --fs-lg: 18px;
        --fs-xl: 28px;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        --t: 180ms;
        --good: #5dff8f;
        --bad: #ff5d6a;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .panel {
        position: absolute;
        top: 14px;
        width: min(34vw, 360px);
        padding: 10px 14px 12px;
        background: var(--glass);
        border: 1px solid var(--hair);
        border-radius: var(--r-lg);
        box-shadow: var(--hi), var(--shadow);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
      }
      .panel.left {
        left: calc(16px + env(safe-area-inset-left));
      }
      .panel.right {
        right: calc(16px + env(safe-area-inset-right));
        text-align: right;
      }
      .name {
        font-size: var(--fs-lg);
        font-weight: 750;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s3);
      }
      .name.long {
        font-size: var(--fs-sm);
        letter-spacing: 0;
      }
      .panel.right .name {
        flex-direction: row-reverse;
      }
      .left .name {
        color: var(--tm);
      }
      .right .name {
        color: var(--tf);
      }
      .panel .name span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .threat {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        opacity: 0.75;
        margin: -1px 0 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .right .threat {
        text-align: right;
        color: var(--tf);
      }
      .left .threat {
        color: var(--tm);
      }
      .tag {
        font-style: normal;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 1px 6px;
        margin: 0 4px;
        border: 1px solid currentColor;
        border-radius: 99px;
        opacity: 0.8;
        vertical-align: middle;
        white-space: nowrap;
      }
      .pips {
        display: flex;
        gap: 5px;
      }
      .pips i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        opacity: 0.45;
        transition: all var(--t) var(--ease);
      }
      .pips i.on {
        background: currentColor;
        opacity: 1;
        box-shadow: 0 0 8px currentColor;
      }
      .st {
        display: none;
        align-items: center;
        gap: 4px;
        font-size: var(--fs-xs);
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--c, #fff);
        flex: none;
      }
      .st.on {
        display: inline-flex;
      }
      .st i {
        width: 9px;
        height: 9px;
        background: var(--c, #fff);
        transform: rotate(45deg) scale(0.85);
        box-shadow: 0 0 5px color-mix(in srgb, var(--c, #fff) 60%, transparent);
      }
      .st:not(:has(b)) {
        margin-left: 5px;
      }
      .right .threat {
        flex-direction: row-reverse;
      }
      .threat > span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar {
        position: relative;
        height: 8px;
        margin-top: 8px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
      }
      .bar > i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, color-mix(in srgb, currentColor 70%, #000), currentColor);
        box-shadow: 0 0 10px color-mix(in srgb, currentColor 55%, transparent);
        transition: width 140ms linear;
      }
      .panel.right .bar > i {
        left: auto;
        right: 0;
        background: linear-gradient(270deg, color-mix(in srgb, currentColor 70%, #000), currentColor);
      }
      .left .spin {
        color: var(--tm);
      }
      .right .spin {
        color: var(--tf);
      }
      .bar.burst {
        height: 4px;
        margin-top: 5px;
        color: #ff4d5e;
      }
      .bar.burst > i {
        width: 0;
      }
      .label {
        font-size: var(--fs-xs);
        font-weight: 600;
        color: var(--dim);
        margin-top: 6px;
        letter-spacing: 0.06em;
      }
      #timer {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        min-width: 92px;
        padding: 2px 18px 4px;
        text-align: center;
        font-size: 38px;
        font-weight: 700;
        line-height: 1.15;
        background: var(--glass);
        border: 1px solid var(--hair);
        border-radius: var(--r-lg);
        box-shadow: var(--hi), var(--shadow);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
      }
      #round {
        position: absolute;
        top: 74px;
        left: 50%;
        transform: translateX(-50%);
        font-size: var(--fs-xs);
        font-weight: 650;
        color: var(--dim);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      /* Phones held sideways: little height, so everything is tighter. */
      @media (max-height: 520px) {
        .panel {
          top: 8px;
          padding: 6px 10px 8px;
          border-radius: var(--r-md);
        }
        .name {
          font-size: var(--fs-md);
        }
        .bar {
          height: 6px;
          margin-top: 5px;
        }
        .bar.burst {
          height: 3px;
        }
        .label {
          display: none;
        }
        #timer {
          top: 8px;
          min-width: 70px;
          padding: 0 12px 2px;
          font-size: 26px;
          border-radius: var(--r-md);
        }
        #round {
          top: 48px;
        }
        #toast {
          top: 22%;
          font-size: var(--fs-md);
        }
      }
      html,
      body,
      #game {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
      }
      #big {
        position: absolute;
        top: 34%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: clamp(48px, 11vw, 130px);
        font-weight: 850;
        font-style: italic;
        letter-spacing: -0.01em;
        text-shadow:
          0 0 30px rgba(255, 170, 80, 0.7),
          0 4px 0 rgba(0, 0, 0, 0.45);
      }
      #big.pop {
        animation: pop 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      @keyframes pop {
        from {
          transform: scale(1.5);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      #sub {
        position: absolute;
        top: calc(34% + clamp(60px, 13vw, 150px));
        left: 0;
        right: 0;
        text-align: center;
        font-size: var(--fs-lg);
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--ink);
      }
      #toast {
        position: absolute;
        top: 24%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #ffe9a8;
        text-shadow: 0 0 16px #ffb347;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #launch {
        position: absolute;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        width: min(70vw, 440px);
        text-align: center;
      }
      #launch .bar {
        height: 14px;
        color: var(--tm);
        border: 1px solid var(--hair-strong);
        background: var(--glass-strong);
      }
      #launch .sweet {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        width: 10%;
        background: rgba(255, 255, 255, 0.3);
        border-left: 2px solid #fff;
      }
      #tilt {
        margin-top: 10px;
        font-size: var(--fs-sm);
        color: var(--dim);
        letter-spacing: 0.06em;
      }
      #ability {
        position: absolute;
        bottom: 24px;
        left: calc(22px + env(safe-area-inset-left));
        width: 92px;
        height: 92px;
        border: 1px solid color-mix(in srgb, var(--me) 70%, transparent);
        border-radius: var(--r-lg);
        color: var(--me);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: var(--fs-md);
        font-weight: 750;
        background: var(--glass-strong);
        box-shadow: var(--hi);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        overflow: hidden;
        transition: box-shadow var(--t) var(--ease);
      }
      #ability.ready {
        box-shadow:
          var(--hi),
          0 0 18px color-mix(in srgb, var(--me) 60%, transparent),
          inset 0 0 14px color-mix(in srgb, var(--me) 28%, transparent);
      }
      #ability small {
        font-size: var(--fs-xs);
        font-weight: 600;
        color: var(--dim);
        letter-spacing: 0.06em;
      }
      #abFill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0;
        background: rgba(0, 0, 0, 0.7);
      }
      #ability span,
      #ability small {
        position: relative;
      }
      #hint {
        padding: 0 130px;
        position: absolute;
        bottom: 22px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: var(--fs-sm);
        font-weight: 550;
        color: var(--dim);
        letter-spacing: 0.02em;
      }
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--s4);
        background: radial-gradient(circle at 50% 40%, rgba(20, 28, 48, 0.72), rgba(3, 4, 8, 0.94));
        cursor: pointer;
        text-align: center;
        padding: 16px;
      }
      #start h1 {
        margin: 0;
        font-size: clamp(44px, 10vw, 110px);
        font-weight: 850;
        font-style: italic;
        letter-spacing: -0.01em;
        background: linear-gradient(100deg, var(--me), #ffd27a 45%, var(--foe));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #start p {
        margin: 0;
        color: var(--dim);
        letter-spacing: 0.04em;
        font-size: var(--fs-md);
        line-height: 1.9;
      }
      #start b {
        color: var(--ink);
      }
      #start .go {
        margin-top: var(--s3);
        padding: 14px 44px;
        min-height: 48px;
        border: 1px solid color-mix(in srgb, var(--me) 70%, transparent);
        border-radius: 99px;
        background: color-mix(in srgb, var(--me) 14%, var(--glass-strong));
        color: var(--me);
        font-weight: 750;
        letter-spacing: 0.18em;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 26px color-mix(in srgb, var(--me) 70%, transparent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      .hidden {
        display: none !important;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Dm9ZO0Rv.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-ByA-X_QQ.css">
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="panel left">
        <div class="name"><span id="n0"></span><span class="pips" id="p0"></span></div>
        <div class="bar spin"><i id="s0"></i></div>
        <div class="bar burst"><i id="b0"></i></div>
        <div class="label">Spin · Burst</div>
      </div>
      <div id="timer">90</div>
      <div id="round"></div>
      <div class="panel right">
        <div class="name"><span id="n1"></span><span class="pips" id="p1"></span></div>
        <div class="bar spin"><i id="s1"></i></div>
        <div class="bar burst"><i id="b1"></i></div>
        <div class="label">Spin · Burst</div>
      </div>
      <div id="toast"></div>
      <div id="big"></div>
      <div id="sub"></div>
      <div id="launch" class="hidden">
        <div class="bar"><i id="pw"></i><b class="sweet"></b></div>
        <div id="tilt"></div>
      </div>
      <div id="ability">
        <div id="abFill"></div>
        <span id="abName"></span>
        <small>Space</small>
      </div>
      <div id="hint">Mouse steers &nbsp;·&nbsp; Click to strike (time it on impact) &nbsp;·&nbsp; Shift boosts &nbsp;·&nbsp; Space ability</div>
    </div>
  </body>
</html>
